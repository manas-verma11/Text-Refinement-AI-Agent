services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: text-refinement-api
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: text-refinement-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://api:8000
    depends_on:
      - api